name: Build Android APK & Test Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Kotlin + Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android_app

      - name: Ensure Gradle Wrapper Executable
        run: |
          cd android_app
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Run Android Unit Tests
        run: |
          cd android_app
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: |
          cd android_app
          ./gradlew assembleDebug --stacktrace

      - name: List Generated APKs
        run: |
          echo "=== Generated APK Files ==="
          find android_app/app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIDITOR-Video-Editor-debug-apk
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  backend-tests:
    name: Run Python Backend & Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg, librsvg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run Test Suites
        run: |
          python3 -m unittest discover tests
